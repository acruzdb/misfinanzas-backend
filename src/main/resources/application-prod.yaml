spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

logging:
  level:
    org.hibernate.SQL: warn

misfinanzas:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-minutes: 15
      refresh-token-days: 30
    google:
      client-id: ${GOOGLE_CLIENT_ID}
    cors:
      allowed-origin: ${FRONTEND_URL}